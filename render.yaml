services:
  # GraphSentinel AI - FastAPI Backend Service (Docker Runtime)
  - type: web
    name: graphsentinel-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: ENABLE_DOCS
        value: "true"
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_GRAPH
        value: graphsentinel-ai
      - key: FALKORDB_SSL
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ADMIN_SECRET
        generateValue: true

  # GraphSentinel AI - React + Vite Frontend (Static Site on Global CDN)
  - type: static_site
    name: graphsentinel-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: graphsentinel-backend
          property: host
